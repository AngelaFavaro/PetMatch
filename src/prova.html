<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Esempio Form Campi Bloccati</title>
    <style>
        body { font-family: sans-serif; margin: 20px; line-height: 1.6; }
        form { max-width: 400px; border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        div { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        
        /* Stile opzionale per differenziare i campi readonly */
        input[readonly] {
            background-color: #f9f9f9;
            border-color: #ddd;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h2>Esempio di Campi Bloccati</h2>

    <form action="#">
        <div>
            <label for="nome">Nome (Editabile):</label>
            <input type="text" id="nome" name="nome" placeholder="Scrivi qui...">
        </div>

        <div>
            <label for="id_ordine">ID Ordine (Readonly - Viene inviato):</label>
            <input type="text" id="id_ordine" name="id_ordine" value="#12345" readonly>
            <small>Puoi cliccarci e copiare il testo, ma non cambiarlo.</small>
        </div>

        <div>
            <label for="email">Email (Disabled - NON viene inviata):</label>
            <input type="email" id="email" name="email" value="utente@esempio.it" disabled>
            <small>Il campo è grigio e non puoi nemmeno selezionarlo.</small>
        </div>

        <div>
            <label for="nazione">Nazione (Menu bloccato):</label>
            <select id="nazione" name="nazione" disabled>
                <option value="italia" selected>Italia</option>
                <option value="francia">Francia</option>
            </select>
        </div>

        <button type="submit">Invia Form</button>
    </form>

</body>
</html>
