<main id="signup">
    <div class="container">
    <form method="post" id="form-signup" novalidate>
        <fieldset>
            <legend>Registrati</legend>
            <div class="column-container">
                <div>
                    <label for="name">Nome</label>
                    <input type="text" name="name" id="name" placeholder="Nome" autocomplete="name" value="[nameValue]">
                    <p>[erroriNome]</p>
                </div>
                <div>
                    <label for="surname">Cognome</label>
                    <input type="text" name="surname" id="surname" placeholder="Cognome" autocomplete="name" value="[surnameValue]">
                    <p>[erroriCognome]</p>
                </div>
            </div>
            <div>
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="email@esempio.com" autocomplete="email" value="[emailValue]">
                <p>[erroriEmail]</p>
            </div>
            <div>
                <label for="password">Password</label>
                <input type="password" name="password" id="password">
            </div>
            <div>
                <label for="passwordConfirm">Conferma password</label>
                <input type="password" name="passwordConfirm" id="passwordConfirm">
                <p>[erroriPassword]</p>
                <p id="infoPassword">La password deve contenere:
                    <ul aria-labelledby="infoPassord">
                        <li>Minimo 8 caratteri, massimo 32</li>
                        <li>Almeno un numero</li>
                        <li>Una lettera maiuscola</li>
                        <li>Una lettera minuscola</li>
                        <li>Almenu un carattere speciale (! @ + ? / , - . $ _ =)</li>
                    </ul>
                </p>
            </div>
            <div id="checkbox-container-signup">
                <input type="checkbox" name="sendEvents" id="checkEvents">
                <label for="checkEvents">
                    Consenti l'invio di email relative agli eventi che svolgiamo
                </label>
            </div>

            <div>
                <button type="submit" name="signup" class="orange-button">
                    Registrati
                </button>
            </div>
        </fieldset>    
        <p id="signup-accedi">Hai già un account? <a href="./accedi">Accedi!</a></p>
    </form>
</main>
