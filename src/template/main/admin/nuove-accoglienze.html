<div id="admin-area">
    <h1>Segnalazioni di nuove accoglienze</h1>

    <div id="animali" class="tabs-container tab-mini segnalazioni">
        <form class="filtri" method="get" action="nuove-accoglienze" >
            <ul aria-label="Filtri di ricerca">
                <li class="capsula-filtro" >
                    <label for="filtro-assegnata">Assegnate</label>
                    <select name="assegnate" id="filtro-assegnata">
                        <option value="tutte" [ASSEGNATE_SELECTED_TUTTE]>Tutte</option>
                        <option value="mie" [ASSEGNATE_SELECTED_MIE]>A me</option>
                        <option value="nessuno" [ASSEGNATE_SELECTED_NESSUNO]>A nessuno</option>
                    </select>
                </li>
            </ul>
            <button type="submit" class="orange-button">Applica</button>
        </form>
        [tabs-animali]
        <article class="tab-content tab1">
            [contenuto-cani]
            [LINKPAGINE-CANI]
        </article>
    
        <article class="tab-content tab2">
            [contenuto-gatti]
            [LINKPAGINE-GATTI]
        </article>
</div>
</div>
