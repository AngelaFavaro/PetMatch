<div id="admin-area-aggiungi">
    <form method="post" id="form-add-animal" enctype="multipart/form-data" novalidate>
        <h1>AGGIUNGI UN ANIMALE</h1>
        <fieldset>
            <legend>Tipologia di animale</legend>
            <div class="radio-group-cg">
                <input type="radio" name="tipologia" id="cane" value="0">
                <label for="cane" class="radio-card">Cane</label>

                <input type="radio" name="tipologia" id="gatto" value="1">
                <label for="gatto" class="radio-card">Gatto</label>
            </div>
            <p class="error-form">[erroriTipologia]</p>
            
        </fieldset>

        <fieldset>
            <legend>Informazioni animale</legend>
            <div class="column-container">
                <div class="column-user">
                    <div>
                        <label for="nome">Nome</label>
                        <input type="text" name="nome" id="nome" placeholder="Nome" autocomplete="nome" value="[nome]">
                        <p class="error-form">[erroriNome]</p>
                    </div>

                    <div>
                        <label for="razza">Razza</label>
                        <input type="text" name="razza" id="razza" placeholder="Razza" autocomplete="razza" value="[razza]">
                        <p class="error-form">[erroriRazza]</p>
                    </div>

                    <label for="taglia">Taglia</label>
                    <select name="taglia" id="taglia" value=>
                        <option value="" disabled selected>Seleziona un'opzione</option>
                        <option value="Piccola">Piccola</option>
                        <option value="Media">Media</option>
                        <option value="Grande">Grande</option>
                    </select>
                    <p class="error-form">[erroriTaglia]</p>

                    <p class="sex-title">Sesso</p>
                    <div class="sex-group">
                        <label class="sex-option">
                            <input type="radio" name="sesso" id="Maschio" value="0" required>
                            <span>Maschio</span>
                        </label>

                        <label class="sex-option">
                            <input type="radio" name="sesso" id="Femmina" value="1">
                            <span>Femmina</span>
                        </label>
                    </div>
                    <p class="error-form">[erroriSesso]</p>
                    
                    <label for="foto">Foto:</label>
                    <input type="file" id="foto" name="foto" accept="image/*">
                </div>

                <div class="column-user">
                    <div>
                        <label for="dataNascita">Data di Nascita: </label>
                        <input type="date" name="dataNascita" id="dataNascita" autocomplete="Data di nascita" value="[dataNascita]">
                        <p class="error-form">[erroriDataNascita]</p>
                    </div>

                    <label for="pelo">Pelo</label>
                    <select name="pelo" id="pelo">
                        <option value="" disabled selected>Seleziona un'opzione</option>
                        <option value="Corto">Corto</option>
                        <option value="Lungo">Lungo</option>
                        <option value="Misto">Misto</option>
                    </select>      
                    
                    <div>
                        <label for="colore">Colore</label>
                        <input type="text" name="colore" id="colore" placeholder="Colore" autocomplete="colore" value="[colore]">
                        <p class="error-form">[erroriColore]</p>
                    </div>

                    <div>
                        <label for="condMediche">Condizioni mediche: </label>
                        <textarea id="condMediche" name="condMediche" placeholder="Inserire testo">[condMediche]</textarea>
                        <p class="error-form">[erroriCondMediche]</p>
                    </div>

                    <div>
                        <label for="carattere">Descrizione caratteriale: </label>
                        <textarea id="carattere" name="carattere" placeholder="Inserire testo">[carattere]</textarea>
                        <p class="error-form">[erroriCarattere]</p>
                    </div>
                </div>
            </div>

        </fieldset>

        <fieldset>
            <legend>Informazioni famiglia</legend>
            <div>
                <label for="famiglia">Famiglia ideale: </label>
                <textarea id="famiglia" name="famiglia" placeholder="Inserire testo">[famiglia]</textarea>
                <p class="error-form">[erroriFamiglia]</p>
            </div>
        </fieldset>    

        <div class="form-buttons-container">
            <button type="submit" name="submit-animal" class="white-button">Salva</button>
            <button type="reset" name="reset" class="white-button">Annulla</button>
        </div>

    </form>
</div>
