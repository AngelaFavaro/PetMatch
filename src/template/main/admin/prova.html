<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Modifica Data</title>
    <style>
        :root {
            --accent-color: #007bff;
            --bg-edit: #f0f4f8;
        }

        body { font-family: sans-serif; padding: 50px; line-height: 1.6; }

        .stato-trasporto {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: fit-content;
        }

        /* Gestione visibilità */
        .hidden { display: none !important; }

        #data-display {
            font-weight: bold;
            cursor: pointer;
        }

        input[type="date"] {
            padding: 5px;
            border: 1px solid var(--accent-color);
            border-radius: 4px;
            background-color: var(--bg-edit);
            font-family: inherit;
        }

        .edit-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
        }

        .edit-btn img {
            width: 18px;
            height: 18px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <h2>Prova Modifica Data Arrivo</h2>

    <article class="stato-trasporto">
        <p>
            <strong>Data di arrivo:</strong> 
            
            <span id="data-text">31/12/2025</span>

            <form id="form-data" class="hidden" style="display: inline;">
                <input type="date" name="data_arrivo" id="input-data" value="2025-12-31">
                <button type="submit" class="hidden"></button>
            </form>
        </p>

        <button type="button" id="btn-attiva-modifica" class="edit-btn">
            <img src="https://cdn-icons-png.flaticon.com/512/1159/1159633.png" alt="Modifica">
        </button>
    </article>

    <div id="feedback" style="margin-top: 20px; color: green; font-weight: bold;"></div>

    <script>
        const btnEdit = document.getElementById('btn-attiva-modifica');
        const dateText = document.getElementById('data-text');
        const formDate = document.getElementById('form-data');
        const inputDate = document.getElementById('input-data');
        const feedback = document.getElementById('feedback');

        // 1. Cliccando sulla matita attivo la modalità editing
        btnEdit.addEventListener('click', () => {
            mostraEditor();
        });

        // 2. Se l'utente clicca sul testo, attivo comunque la modifica (comodità)
        dateText.addEventListener('click', () => {
            mostraEditor();
        });

        function mostraEditor() {
            dateText.classList.add('hidden');
            formDate.classList.remove('hidden');
            
            // Apre automaticamente il calendario sui browser moderni
            if (typeof inputDate.showPicker === 'function') {
                inputDate.showPicker();
            }
            inputDate.focus();
        }

        // 3. Quando l'input perde il focus (blur), invio il form
        inputDate.addEventListener('blur', () => {
            // Piccolo timeout per permettere al valore di aggiornarsi se l'utente ha appena cliccato
            setTimeout(() => {
                sendData();
            }, 100);
        });

        // 4. Se preme INVIO dentro l'input date
        formDate.addEventListener('submit', (e) => {
            e.preventDefault();
            sendData();
        });

        function sendData() {
            const newDate = inputDate.value;
            
            // Torniamo subito alla visualizzazione testo (ottimismo UI)
            dateText.classList.remove('hidden');
            formDate.classList.add('hidden');

            if (!newDate) return;

            // Formattiamo la data per l'utente (da YYYY-MM-DD a DD/MM/YYYY)
            const parti = newDate.split('-');
            dateText.innerText = `${parti[2]}/${parti[1]}/${parti[0]}`;

            // Eseguiamo la chiamata POST
            feedback.innerText = "Salvataggio in corso...";

            // NOTA: window.location.href è l'URL attuale. 
            // In produzione qui riceverai la POST nel tuo PHP.
            fetch(window.location.href, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    salva_data_arrivo: 1,
                    data_arrivo: newDate
                })
            })
            .then(response => {
                feedback.innerText = "Data aggiornata con successo!";
                setTimeout(() => { feedback.innerText = ""; }, 3000);
            })
            .catch(error => {
                feedback.innerText = "Errore durante il salvataggio.";
            });
        }
    </script>

</body>
</html>
