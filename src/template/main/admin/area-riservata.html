<div id="admin-area">
    <h1>Ciao [nomeAdmin]!</h1> <!--TODO -->
    <article id="query">
        <h2>DA COMPLETARE</h2>
        [to-do-list]
    </article id="row2-container">
    <div id="row2">
        <article id="statistics-area">
            <h2>LE TUE STATISTICHE</h2>
            [stats]
        </article>
        <article id="admin-info">
            <div class="header-info">
                <h2>LE TUE INFORMAZIONI</h2>
                <!-- TODO da mettere collegamento-->
                <a href="./">
                    <img src="./assets/icons/edit-pencil.svg" alt="Modificare le informazioni">
                </a>
            </div>

            <div class="generic-info-container">
                <img src="[imagePath]" alt="Foto di [nome]" class="circle-foto">
                
                <div class="text-details">
                    <ul>
                        <li><strong>Nome:</strong> [nomeAdmin]</li>
                        <li><strong>Cognome:</strong> [cognomeAdmin]</li>
                        <li><strong>Email:</strong> [emailAdmin]</li>
                    </ul>
                </div>
            </div>
        </article>
    </div>
    
</div>
