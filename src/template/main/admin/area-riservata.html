<div id="admin-area">
    <h1>Ciao [nomeAdmin]!</h1> <!--TODO -->
    <article id="query">
        <h2>DA COMPLETARE</h2>
        [to-do-list]
    </article id="row2-container">
    <div id="row2">
        <article id="statistics-area">
            <h2>LE TUE STATISTICHE</h2>
            [stats]
        </article>
        <article id="admin-info">
            
            <!-- [admin-info] -->
            <div class="header-info">
                <h2>LE TUE INFORMAZIONI</h2>
                <button type="button" id="edit-admin-info" class="btn-edit">
                    <img src="./assets/icons/edit-pencil.svg" alt="Modifica">
                </button>
            </div>

            <div class="generic-info-container">
                <img src="[imgPath]" alt="Foto" class="circle-foto">
                
                <form method="POST" enctype="multipart/form-data">    
                    <ul id="admin-details">
                        <li>
                            <label for="nome">Nome:</label>
                            <input type="text" id="nome" name="nome" value="[nomeAdmin]" readonly>
                        </li>
                        <li>
                            <label for="cognome">Cognome:</label>
                            <input type="text" id="cognome" name="cognome" value="[cognomeAdmin]" readonly>             
                        </li>
                        <li>
                            <label for="foto">Foto:</label>
                            <input type="file" id="foto" name="foto" accept="image/*" disabled>
                        </li>

                    </ul>
                    <button name="submit-edit" type="submit" id="submit-edit" hidden class="orange-button" >Salva Modifiche</button>
                </form>
            </div>

    </div>
